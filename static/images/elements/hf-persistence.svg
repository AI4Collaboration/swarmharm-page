<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<title>Research notes connect agents across several days</title><desc>July 8: agents establish a cache message board. July 9: one agent hands research notes to a fresh agent. July 11: peers share and reproduce HF exploits. The note icons show shared progress across separate runs, not one uninterrupted agent run or an exact chain between the pictured agents. Source: METR investigation.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283746"/><stop offset=".45" stop-color="#101b27"/><stop offset="1" stop-color="#080e16"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34495a"/><stop offset="1" stop-color="#111d29"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#1a3244" stop-opacity=".48"/><stop offset="1" stop-color="#030406" stop-opacity="0"/></radialGradient>
