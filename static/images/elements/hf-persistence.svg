  </symbol>
  <symbol id="chat" viewBox="0 0 100 80"><path d="M7 5h86v55H57L37 76V60H7Z" fill="url(#panel)" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 23h51M24 37h39" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="folder" viewBox="0 0 120 100"><path d="M7 24V10h41l13 13h52v68H7Z" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><path d="M7 35h109l-13 57H7Z" fill="url(#paper)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
  <symbol id="note" viewBox="0 0 80 100"><path d="M9 4h43l20 20v71H9Z" fill="url(#paper)" stroke="currentColor" stroke-width="2.5"/><path d="M52 4v21h20M22 43h35M22 55h35M22 67h24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="key" viewBox="0 0 100 48"><circle cx="23" cy="24" r="16" fill="#0d1720" stroke="currentColor" stroke-width="3"/><circle cx="19" cy="22" r="4" fill="currentColor"/><path d="M39 24h55m-8 0v13m-14-13v9" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="lock" viewBox="0 0 80 90"><path d="M19 38V24a21 21 0 0 1 42 0v14" fill="none" stroke="currentColor" stroke-width="5"/><rect x="7" y="37" width="66" height="47" rx="5" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><circle cx="40" cy="56" r="5" fill="currentColor"/><path d="M40 59v12" stroke="currentColor" stroke-width="4"/></symbol>
  <symbol id="open-lock" viewBox="0 0 80 90"><path d="M22 39V23a21 21 0 0 1 40-8" fill="none" stroke="currentColor" stroke-width="5"/><rect x="7" y="37" width="66" height="47" rx="5" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><circle cx="40" cy="56" r="5" fill="currentColor"/><path d="M40 59v12" stroke="currentColor" stroke-width="4"/></symbol>
  <symbol id="terminal" viewBox="0 0 120 100"><rect x="5" y="5" width="110" height="72" rx="4" fill="url(#panel)" stroke="currentColor" stroke-width="2.8"/><path d="M5 21h110M44 94h32M60 78v16" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m24 35 15 12-15 12m25 0h25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="13" r="2" fill="currentColor"/><circle cx="24" cy="13" r="2" fill="currentColor"/></symbol>
  <symbol id="flag" viewBox="0 0 64 70"><path d="M12 67V5m0 1h41l-9 16 9 16H12" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
