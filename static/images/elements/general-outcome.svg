<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
<title>Hacking as a possible outcome</title><desc>An agent crosses an authorization boundary by exploiting an available weakness. This is an outcome to observe, not a setup dimension.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283746"/><stop offset=".45" stop-color="#101b27"/><stop offset="1" stop-color="#080e16"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34495a"/><stop offset="1" stop-color="#111d29"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#1a3244" stop-opacity=".48"/><stop offset="1" stop-color="#030406" stop-opacity="0"/></radialGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#dce8f3" stroke-width="1.5"/></marker>
  <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#ff947f" stroke-width="1.5"/></marker>
  <symbol id="agent" viewBox="0 0 100 100">
    <path d="M50 0v9M22 29H13v18h9m56-18h9v18h-9" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M29 10h42l10 10v32L69 64H31L19 52V20Z" fill="url(#panel)" stroke="currentColor" stroke-width="2.3"/>
    <rect x="28" y="25" width="44" height="22" rx="6" fill="#050a10" stroke="#7792aa" stroke-width="1.5"/>
    <path d="M38 34v5m24-5v5" stroke="#eef9ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 55h20M32 65 16 79v17h68V79L68 65" fill="url(#panel)" stroke="currentColor" stroke-width="2.3"/>
    <path d="M27 79v13m46-13v13" stroke="#7792aa" stroke-width="1.5"/>
  </symbol>
  <symbol id="chat" viewBox="0 0 100 80"><path d="M7 5h86v55H57L37 76V60H7Z" fill="url(#panel)" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 23h51M24 37h39" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="folder" viewBox="0 0 120 100"><path d="M7 24V10h41l13 13h52v68H7Z" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><path d="M7 35h109l-13 57H7Z" fill="url(#paper)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
  <symbol id="note" viewBox="0 0 80 100"><path d="M9 4h43l20 20v71H9Z" fill="url(#paper)" stroke="currentColor" stroke-width="2.5"/><path d="M52 4v21h20M22 43h35M22 55h35M22 67h24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="key" viewBox="0 0 100 48"><circle cx="23" cy="24" r="16" fill="#0d1720" stroke="currentColor" stroke-width="3"/><circle cx="19" cy="22" r="4" fill="currentColor"/><path d="M39 24h55m-8 0v13m-14-13v9" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></symbol>
  <symbol id="lock" viewBox="0 0 80 90"><path d="M19 38V24a21 21 0 0 1 42 0v14" fill="none" stroke="currentColor" stroke-width="5"/><rect x="7" y="37" width="66" height="47" rx="5" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><circle cx="40" cy="56" r="5" fill="currentColor"/><path d="M40 59v12" stroke="currentColor" stroke-width="4"/></symbol>
  <symbol id="open-lock" viewBox="0 0 80 90"><path d="M22 39V23a21 21 0 0 1 40-8" fill="none" stroke="currentColor" stroke-width="5"/><rect x="7" y="37" width="66" height="47" rx="5" fill="url(#panel)" stroke="currentColor" stroke-width="2.5"/><circle cx="40" cy="56" r="5" fill="currentColor"/><path d="M40 59v12" stroke="currentColor" stroke-width="4"/></symbol>
  <symbol id="terminal" viewBox="0 0 120 100"><rect x="5" y="5" width="110" height="72" rx="4" fill="url(#panel)" stroke="currentColor" stroke-width="2.8"/><path d="M5 21h110M44 94h32M60 78v16" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m24 35 15 12-15 12m25 0h25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="13" r="2" fill="currentColor"/><circle cx="24" cy="13" r="2" fill="currentColor"/></symbol>
  <symbol id="flag" viewBox="0 0 64 70"><path d="M12 67V5m0 1h41l-9 16 9 16H12" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="trophy" viewBox="0 0 90 90"><path d="M22 8h46v20c0 19-12 30-23 30S22 47 22 28Z" fill="url(#panel)" stroke="currentColor" stroke-width="3"/><path d="M22 15H8v12c0 12 8 19 19 19m41-31h14v12c0 12-8 19-19 19M45 58v18m-18 7h36M34 76h22" fill="none" stroke="currentColor" stroke-width="3"/><path d="m45 19 4 8 9 1-7 7 2 9-8-4-8 4 2-9-7-7 9-1Z" fill="currentColor"/></symbol></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eef4fa;font-size:24px;letter-spacing:.2px}
.small{font-size:20px}.micro{font-size:17px;letter-spacing:.6px}.muted{fill:#aebdcd}.red{fill:#ffad98}.ink{color:#d5e2ef}.risk{color:#ff947f}
.line{fill:none;stroke:#70869b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:#dce8f3;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.risk-route{fill:none;stroke:#ff947f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#red-arrow)}
</style>

<use href="#agent" x="22" y="41" width="85" height="85" class="ink"/>
<text x="64" y="157" text-anchor="middle" class="small">Agent</text>
<path class="route" d="M119 79h110"/>
<circle cx="247" cy="79" r="16" fill="#150e10" stroke="#ff947f" stroke-width="1.8"/>
<path d="m241 73 12 12m0-12-12 12" fill="none" stroke="#ff947f" stroke-width="2.5"/>
<path d="M285 24h70v88m0 62v17h-70v-17m0-62V24" fill="none" stroke="#627589" stroke-width="2"/>
<use href="#lock" x="301" y="35" width="38" height="44" class="ink"/>
<text x="320" y="104" text-anchor="middle" class="micro muted">Permission</text>
<path class="line" d="M365 79h126" stroke-dasharray="6 9"/>
<path class="risk-route" d="M127 98v49h151m85 0h177v-36"/>
<rect x="278" y="121" width="85" height="53" fill="#231510" stroke="#ff947f" stroke-width="1.5" stroke-dasharray="4 4"/>
<use href="#open-lock" x="302" y="124" width="37" height="43" class="risk"/>
<use href="#folder" x="494" y="35" width="105" height="88" class="ink"/>
<text x="548" y="190" text-anchor="middle" class="small">Private files</text>
<text x="320" y="198" text-anchor="middle" class="small red">Exploited weakness</text>

</svg>
