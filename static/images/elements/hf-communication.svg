<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<title>Artifactory used as an unauthorized message board</title><desc>An agent creates a directory in the shared Artifactory cache; another isolated agent reads the directory listing. Directory names carry messages. The full actual cache directory is shown, as reported by METR.</desc>
<defs>
  <radialGradient id="ambient"><stop stop-color="#333a45" stop-opacity=".48"/><stop offset="1" stop-color="#030406" stop-opacity="0"/></radialGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#727b86"/><stop offset=".35" stop-color="#323942"/><stop offset="1" stop-color="#10151c"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#1d242c"/><stop offset="1" stop-color="#090c11"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080b10"/><stop offset="1" stop-color="#3a424c"/></linearGradient>
  <linearGradient id="wall"><stop stop-color="#a7b5c4" stop-opacity=".03"/><stop offset=".8" stop-color="#c4ceda" stop-opacity=".15"/><stop offset="1" stop-color="#f3f6fc" stop-opacity=".36"/></linearGradient>
  <pattern id="floor" width="64" height="32" patternUnits="userSpaceOnUse"><path d="M0 0 64 32M64 0 0 32" fill="none" stroke="#6f7c8e" stroke-width=".65" opacity=".16"/></pattern>
  <symbol id="unit" viewBox="-66 -51 132 130">
    <ellipse cx="0" cy="51" rx="65" ry="24" fill="url(#ambient)"/>
    <g stroke="#8c98a7" stroke-width=".85" stroke-linejoin="round">
      <path d="m-43-9 43-25 43 25L0 16Z" fill="url(#top)"/>
      <path d="M-43-9 0 16v46l-43-25Z" fill="url(#face)"/>
      <path d="M0 16 43-9v46L0 62Z" fill="url(#edge)"/>
      <path d="m-28-9 28-16 28 16L0 7Z" fill="#10151b" stroke="#c3cbd6"/>
      <path d="m-12-9 12-7 12 7L0-2Z" fill="#e3e8ee" stroke="#fff"/>
      <path d="m-35 8 27 16m-27-7 27 16m-27-7 27 16m17-18 26-15m-26 24 26-15m-26 24 26-15" fill="none" stroke="#657282"/>
    </g>
    <path d="m-36 34 9 5m3 2 6 3" stroke="#edf5ff" stroke-width="1.5"/>
  </symbol>
  <symbol id="deck" viewBox="-100 -54 200 113">
    <g stroke="#8d99a9" stroke-width=".9" stroke-linejoin="round"><path d="m-83-2 83-47 83 47L0 45Z" fill="url(#top)"/><path d="m-83-2 83 47v13l-83-47Z" fill="url(#face)"/><path d="m0 45 83-47v13L0 58Z" fill="url(#edge)"/><path d="m-65-2 65-36 65 36L0 34Z" fill="#0d1219" stroke="#677586"/><path d="m-46-1 46-26 46 26L0 25Z" fill="none" stroke="#cdd6e2"/><path d="m-67 16 16 9m5 3 8 4" stroke="#f2f6fc"/></g>
  </symbol>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#ecf0f4;font-size:21px;letter-spacing:1.1px}
.muted{fill:#a4acb8;font-size:17px;letter-spacing:.8px}.small{font-size:16px}.line{fill:none;stroke:#76818e;stroke-width:1.15}.trace{fill:none;stroke:#f0f4f9;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.risk{stroke:#f16b57}.risk-label{fill:#ff8c79}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3.8s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.draw{animation:none}}
</style>
<ellipse cx="320" cy="172" rx="300" ry="150" fill="url(#ambient)"/>
<path d="m20 172 300-120 300 120-300 112Z" fill="url(#floor)" opacity=".5"/>
<text x="100" y="28" text-anchor="middle">TASK A</text>
<text x="540" y="28" text-anchor="middle">TASK B</text>
<path d="m41 73 59-34 59 34v67l-59 34-59-34Z M481 73l59-34 59 34v67l-59 34-59-34Z" fill="url(#wall)" stroke="#758192" stroke-dasharray="4 5"/>
<use href="#unit" x="49" y="49" width="102" height="101"/>
<use href="#unit" x="489" y="49" width="102" height="101"/>
<path class="line" d="M163 96h137m40 0h137" stroke-dasharray="5 7"/>
<text x="320" y="65" text-anchor="middle" class="muted">NO PEER CHANNEL</text>
<circle cx="320" cy="96" r="17" fill="#090c11" stroke="#9ba6b4"/>
<path class="line" d="m313 89 14 14m-14 0 14-14"/>
<!-- A directory write and a directory listing connect otherwise isolated tasks. -->
<path class="trace risk" opacity=".55" d="M100 163v52h151m138 0h151v-52"/>
<path class="trace risk draw" pathLength="1" d="M100 163v52h151m138 0h151v-52"/>
<path class="trace risk" d="m241 208 10 7-10 7m292-46 7-13 7 13"/>
<text x="320" y="150" text-anchor="middle">ARTIFACTORY CACHE</text>
<use href="#deck" x="264" y="184" width="112" height="63"/>
<use href="#deck" x="264" y="168" width="112" height="63"/>
<path d="m297 199 23-13 23 13-23 13Z" fill="#331b1b" stroke="#ff8c79"/>
<path d="m309 197 11-6 11 6" fill="none" stroke="#ffad9d"/>
<text x="32" y="245" class="small risk-label">CREATE DIRECTORY</text>
<text x="608" y="245" text-anchor="end" class="small risk-label">READ DIRECTORY NAMES</text>
<path class="line" d="M320 246v27"/>
<!-- Source: METR / Redwood, July 8–9 message-board account. -->
<path d="M18 274h586l18 18v90H18Z" fill="#0b121a" stroke="#354350"/>
<path d="M18 289v-15h31m542 108h31v-19" fill="none" stroke="#8c9daa"/>
<text x="36" y="302" class="muted" style="font-size:16px">ACTUAL MESSAGE DIRECTORY</text>
<text x="604" y="302" text-anchor="end" class="muted" style="font-size:16px">METR</text>
<text x="36" y="332" style="font-family:monospace;font-size:19px;letter-spacing:0;fill:#c4cfdb">github-remote-cache/</text>
<text x="36" y="362" style="font-family:monospace;font-size:19px;letter-spacing:0;fill:#ffad9d">zzHELP_PHASEONE_ARV010841_NO_CONSUMER_SEEK_IDEA</text>
</svg>
