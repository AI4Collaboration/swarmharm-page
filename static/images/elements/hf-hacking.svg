<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<title>Upload a dataset, read worker secrets, then execute commands</title><desc>High-level route reported by OpenAI: exposed HF credentials enable dataset uploads; HDF5 external-file handling exposes worker secrets; using the recovered access, RefJinja template injection enables commands on HF workers. The graphic describes two distinct weaknesses and their observed effects, not exploit instructions.</desc>
